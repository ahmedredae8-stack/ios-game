name: Build Shaker iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch: # يتيح لك بدء البناء يدوياً بضغطة زر من صفحة Actions

jobs:
  build-ios:
    name: Build Shaker IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS binaries
        run: |
          git lfs pull
          chmod +x *.sh || true

      - name: Select latest stable Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Apple Certificates (Optional)
        id: setup_signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ] && [ -n "$BUILD_PROVISION_PROFILE_BASE64" ]; then
            echo "Signing secrets found, configuring keychain..."
            CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
            PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
            KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

            echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
            echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security default-keychain -s $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
            echo "SIGNED=true" >> $GITHUB_ENV
          else
            echo "No signing secrets provided, building unsigned IPA..."
            echo "SIGNED=false" >> $GITHUB_ENV
          fi

      - name: Build Xcode Archive
        run: |
          mkdir -p build
          if [ "$SIGNED" = "true" ]; then
            xcodebuild archive \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/Shaker.xcarchive \
              COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild archive \
              -project Unity-iPhone.xcodeproj \
              -scheme Unity-iPhone \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/Shaker.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi

      - name: Package IPA
        run: |
          mkdir -p build/output
          APP_PATH=$(find build/Shaker.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in archive"
            exit 1
          fi

          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -q -r build/output/Shaker.ipa Payload
          rm -rf Payload
          echo "IPA created successfully at build/output/Shaker.ipa"

      - name: Upload Shaker IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shaker-iOS-IPA
          path: build/output/Shaker.ipa
          retention-days: 14
