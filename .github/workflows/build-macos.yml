name: Build iOS Game (Shaker)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Shaker IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout Repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS Objects
        run: |
          git lfs install
          git lfs pull

      - name: Select Latest Installed Xcode
        run: |
          echo "=== الإصدارات المتاحة من Xcode ==="
          ls -d /Applications/Xcode*.app
          NEWEST_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -n1)
          echo "تم اختيار: $NEWEST_XCODE"
          sudo xcode-select -s "$NEWEST_XCODE"
          xcodebuild -version

      - name: Build and Archive
        run: |
          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Unity-iPhone.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            archive

      - name: Package App into IPA
        run: |
          mkdir -p Payload
          cp -r build/Unity-iPhone.xcarchive/Products/Applications/*.app Payload/
          zip -r -y Shaker.ipa Payload
          ls -lh Shaker.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shaker-iOS-IPA
          path: Shaker.ipa
          retention-days: 14
